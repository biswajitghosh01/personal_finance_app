{% extends 'base.html' %}{% block title %}Edit Transaction{% endblock %}{% block page_heading %}Transactions{% endblock %}{% block content %}
<section class="page-intro"><div><span class="eyebrow">EDIT RECORD</span><h1>Edit Transaction</h1></div><a class="button secondary" href="{{ url_for('transactions') }}">Cancel</a></section>
<form method="post" class="panel form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Date<input type="date" name="transaction_date" value="{{ transaction['transaction_date'] }}" required></label><label>Type<select name="transaction_type" required>{% for item in types %}<option value="{{ item }}" {% if transaction['transaction_type']==item %}selected{% endif %}>{{ item|replace('_',' ')|title }}</option>{% endfor %}</select></label>
<label>Category<input name="category" maxlength="80" value="{{ transaction['category'] }}" required></label><label>Description<input name="description" maxlength="180" value="{{ transaction['description'] }}" required></label>
<label>Amount<input type="number" step="any" min="0" name="amount" value="{{ transaction['amount'] }}" required></label><label>Currency<select name="currency" required>{% for item in currencies %}<option value="{{ item }}" {% if transaction['currency']==item %}selected{% endif %}>{{ currency_symbol(item) }} {{ item }}</option>{% endfor %}</select></label>
<label>Account / Source<input name="account_name" maxlength="120" value="{{ transaction['account_name'] }}"></label><label class="full">Notes<textarea name="notes" maxlength="1000">{{ transaction['notes'] }}</textarea></label><div class="full form-actions"><button type="submit">Update Transaction</button></div></form>{% endblock %}
